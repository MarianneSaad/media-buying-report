  // ---------- By Assignee page's alternate "Group: By Client" view — same period's rows, but
  // rolled up by client instead of by person, so you can see who covers each client at a glance
  // and expand a client to see its brand-level assignee breakdown. ----------
  function renderAssigneeByClient(rows, overallStats){
    const groups = groupRowsByClient(rows, state.tolerance).sort((a,b)=> b.brands.length - a.brands.length || a.client.localeCompare(b.client));
    const totalClients = groups.length;
    const totalBrands = rows.length;
    const assigneesInvolved = new Set();
    groups.forEach(g=>(g.assignees||[]).forEach(a=>assigneesInvolved.add(a)));
    const busiestClient = groups.length ? groups.reduce((a,b)=> b.brands.length>a.brands.length ? b : a) : null;
    const avgBrandsPerClient = totalClients ? (totalBrands/totalClients) : null;
    return `
      <div class="assignee-kpi-line">
        <div class="akpi-chip"><b style="color:var(--purple)">${totalClients} clients</b>${totalBrands} brands</div>
        <div class="akpi-chip"><b style="color:var(--pink)">${assigneesInvolved.size}</b>Assignees Involved</div>
        <div class="akpi-chip"><b style="color:var(--orange)">${busiestClient ? busiestClient.client : "—"}</b>Most Brands${busiestClient ? " · "+busiestClient.brands.length+" brands" : ""}</div>
        <div class="akpi-chip"><b style="color:var(--teal)">${avgBrandsPerClient===null?"—":avgBrandsPerClient.toFixed(1)}</b>Avg Brands / Client</div>
      </div>
      <div class="assignee-kpi-line" style="margin:14px 0 22px 0;">
        <div class="akpi-chip"><b class="text-over">${overallStats.overCount}</b>Overspend</div>
        <div class="akpi-chip"><b class="text-under">${overallStats.underCount}</b>Underspend</div>
        <div class="akpi-chip"><b class="text-target">${overallStats.targetCount}</b>On Target</div>
        <div class="akpi-chip">Avg Overspend: <b class="text-over">${fmtMoney(overallStats.avgOverspend)}</b></div>
        <div class="akpi-chip">Avg Underspend: <b class="text-under">${fmtMoney(overallStats.avgUnderspend)}</b></div>
        <div class="akpi-chip">Avg On Target: <b class="text-target">${fmtMoney(overallStats.avgOnTarget)}</b></div>
      </div>
      <div class="section-title" style="margin:0 0 12px 0; text-align:center;">Clients <span class="pill">click a client to see who's assigned</span></div>
      <div class="assignee-namelist">
        ${groups.map((g,i)=>{
          const color = AVATAR_COLORS[i%AVATAR_COLORS.length];
          const isActive = state.drillClient === g.client;
          const overC = g.brands.filter(b=>b.status==="Overspend").length;
          const underC = g.brands.filter(b=>b.status==="Underspend").length;
          const targetC = g.brands.filter(b=>b.status==="On Target").length;
          const assigneeLabel = g.assignees.length ? g.assignees.map(firstName).join(", ") : "Unassigned";
          return `
          <div class="assignee-name-card${isActive?" active":""}" data-clientdrill="${g.client}">
            <div class="an-name" style="color:${color}">${g.client}</div>
            <div class="an-side">
              <div class="an-count">${g.brands.length} brand${g.brands.length===1?"":"s"} · ${assigneeLabel}</div>
              <div class="an-mix">
                <span class="${overC>0?"text-over":"text-zero"}">${overC} over</span>
                <span class="${underC>0?"text-under":"text-zero"}">${underC} under</span>
                <span class="${targetC>0?"text-target":"text-zero"}">${targetC} target</span>
              </div>
            </div>
          </div>
          ${isActive ? `<div class="assignee-drill-wrap">${renderClientAssigneeDrill(g)}</div>` : ""}`;
        }).join("")}
      </div>
    `;
  }
  function renderClientAssigneeDrill(g){
    return `<div class="drill-panel" style="margin:8px 0;">

        <thead><tr><th>Brand</th><th>Assignee</th><th class="num-cell">Approved</th><th class="num-cell">Actual</th><th class="num-cell">U/O Spend $</th><th class="num-cell">Usage %</th><th>Status</th></tr></thead>

  function renderAssigneeDrillRow(c, nested){

  function renderAssigneeDrillGroupRow(g){

  function renderAssigneeDrill(a){

  function populateSelectors(){
    const years = [...new Set(PERIODS.map(p=>p.year))].sort();

    state.year = years[years.length-1];
    yearSelect.value = state.year;

    function monthsForYear(y){
      return PERIODS.filter(p=>p.year===y).map(p=>p.month).sort((a,b)=>a-b);
    }
    function refreshMonthOptions(){
      const months = monthsForYear(state.year);
      monthSelect.innerHTML = months.map(m=>`<option value="${m}">${MONTH_NAMES[m]}</option>`).join("");
      state.month = months[months.length-1];
      monthSelect.value = state.month;
    }
    refreshMonthOptions();

    yearSelect.addEventListener("change", ()=>{
      state.year = Number(yearSelect.value);
      if(state.tab === "client") state.clientPeriod = "year";
      refreshMonthOptions();
      render();
    });
    // Picking a value in the Month/Week dropdown should actually switch the page into that
    // granularity — otherwise the selector visibly changes but the report below it (which was
    // still reading Year-mode data) never moves, which is exactly the "dropdown does nothing"
    // bug. Only Report and By Client actually have a granularity concept to switch.
    monthSelect.addEventListener("change", ()=>{

  document.getElementById("periodTabs").addEventListener("click", (e)=>{

  // Delegated clicks inside the content area: stat-card drill-down, drill-panel close,
  // the Report page's own Year/Month/Week toggle, and the By Client sub-nav.
  contentEl.addEventListener("click", (e)=>{
    const closeBtn = e.target.closest("[data-drill-close]");
    if(closeBtn){
      if(closeBtn.dataset.drillClose === "overview") state.overviewDrill = null;
      else state.drillStatus = null;
      render();
      return;
    }

    const ovNum = e.target.closest("td.ov-num-clickable");
    if(ovNum){
      const year = Number(ovNum.dataset.ovYear), month = Number(ovNum.dataset.ovMonth), status = ovNum.dataset.ovStatus;
      const same = state.overviewDrill && state.overviewDrill.mode==="status" && state.overviewDrill.year===year && state.overviewDrill.month===month && state.overviewDrill.status===status;
      state.overviewDrill = same ? null : { year, month, status, mode:"status" };
      render();
      return;
    }

    const ovPeriod = e.target.closest("td.ov-period-clickable");
    if(ovPeriod){
      const year = Number(ovPeriod.dataset.ovcYear), month = Number(ovPeriod.dataset.ovcMonth);
      const same = state.overviewDrill && state.overviewDrill.mode==="clients" && state.overviewDrill.year===year && state.overviewDrill.month===month;
      state.overviewDrill = same ? null : { year, month, mode:"clients" };
      render();
      return;
    }

    const overviewRangeBtn = e.target.closest(".control-row button[data-overviewrange]");
    if(overviewRangeBtn){
      state.overviewRange = overviewRangeBtn.dataset.overviewrange;
      render();
      return;
    }

    const snapName = e.target.closest(".snapshot-name-clickable");
    if(snapName){
      const name = snapName.dataset.snapname;
      state.snapshotDrillBrand = (state.snapshotDrillBrand === name) ? null : name;
      render();
      return;
    }

    const statCard = e.target.closest(".stat-card[data-status]");
    if(statCard){
      const status = statCard.dataset.status;
      state.drillStatus = (state.drillStatus === status) ? null : status;
      render();
      return;
    }

    const reportBtn = e.target.closest(".control-row button[data-reportperiod]");
    if(reportBtn){
      state.reportGranularity = reportBtn.dataset.reportperiod;
      render();
      return;
    }

    const assigneeRow = e.target.closest(".assignee-name-card[data-assignee]");
    if(assigneeRow){
      const name = assigneeRow.dataset.assignee;
      state.drillAssignee = (state.drillAssignee === name) ? null : name;
      render();
      return;
    }

    const assigneeSubBtn = e.target.closest(".control-row button[data-assigneeperiod]");
    if(assigneeSubBtn){
      state.assigneeGranularity = assigneeSubBtn.dataset.assigneeperiod;
      state.drillAssignee = null;
      render();
      return;
    }

    const assigneeGroupByBtn = e.target.closest(".control-row button[data-assigneegroupby]");
    if(assigneeGroupByBtn){
      state.assigneeGroupBy = assigneeGroupByBtn.dataset.assigneegroupby;
      state.drillAssignee = null;
      state.drillClient = null;
      render();
      return;
    }

    const clientDrillRow = e.target.closest(".assignee-name-card[data-clientdrill]");
    if(clientDrillRow){
      const client = clientDrillRow.dataset.clientdrill;
      state.drillClient = (state.drillClient === client) ? null : client;
      render();
      return;
    }

    const clientToggle = e.target.closest("[data-toggle-client]");
    if(clientToggle){
      const client = clientToggle.dataset.toggleClient;
      if(state.expandedClientGroups.has(client)) state.expandedClientGroups.delete(client);
      else state.expandedClientGroups.add(client);
      render();
      return;
    }

    const sortTh = e.target.closest("#overviewTable th[data-sortkey]");
    if(sortTh){
      const key = sortTh.dataset.sortkey;
      if(state.overviewSort.key === key){
        state.overviewSort.dir = state.overviewSort.dir === "desc" ? "asc" : "desc";
      } else {
        state.overviewSort = { key, dir: "desc" };
      }
      render();
      return;
    }
  });

  // The API caches its ClickUp response for up to 30 min server-side (s-maxage=1800) so we don't
  // hammer ClickUp on every page view. A plain fetch("/api/report") on Refresh hits that SAME
  // cached response — clicking Refresh looked like it did nothing because it effectively did
  // nothing. Passing a unique query string busts Vercel's cache key so Refresh always pulls a
  // truly live copy from ClickUp, while normal page loads still benefit from the cache.
  async function load(forceFresh){
    contentEl.innerHTML = `<div class="loading">Loading live data from ClickUp…</div>`;
    try{
      const url = forceFresh ? `/api/report?fresh=${Date.now()}` : "/api/report";
      const resp = await fetch(url, forceFresh ? { cache: "no-store" } : undefined);
      const json = await resp.json();
      if(!resp.ok) throw new Error(json.error || "Failed to load report");
      state.data = json;
      populateClientSelect();
      render();
    }catch(err){
      contentEl.innerHTML = `<div class="error">Couldn't load data: ${err.message}</div>`;
    }
  }

  // Populate the pickers immediately from the known calendar coverage — no need to
  // wait on the live ClickUp fetch just to browse periods.
  populateSelectors();
  refreshBtn.addEventListener("click", ()=>load(true));
  load();
})();
</script>
</body>
</html>
