<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Media buying spend pacing report" />
<title>Inspired Africa | Giraffe Creatives — Media Buying Report</title>
<style>
  :root{
    --ink:#22223b;
    --muted:#7a7f8d;
    --purple:#701888;
    --pink:#c02088;
    --orange:#f89000;
    --red:#f84018;
    --teal:#48b8c8;
    --bg:#ffffff;
    --card:#f8f8fb;
    --border:#eceef2;
    --green:#1a9c6d;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--bg);
  }
  a{color:inherit}

  /* ---------- Header ---------- */
  header.site{
    padding:26px 32px 0 32px;
  }
  .header-top{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;
    padding-bottom:20px;
  }
  .logo-row{display:flex; align-items:center; gap:18px;}
  .logo-row img{height:56px; display:block;}
  .brand-row{display:flex; align-items:center; gap:12px;}
  .brand-row .brand-text{
    font-family:Georgia,"Times New Roman",serif; font-weight:700; font-size:22px; color:#9a9a9f;
    letter-spacing:.2px;
  }
  .bars-icon{display:flex; flex-direction:column; gap:3px;}
  .bars-icon span{display:block; width:26px; height:4px; border-radius:3px;}
  .bars-icon span:nth-child(1){background:var(--purple);}
  .bars-icon span:nth-child(2){background:var(--pink);}
  .bars-icon span:nth-child(3){background:var(--orange);}
  .bars-icon span:nth-child(4){background:var(--red); width:18px;}

  /* Rounded white card with a thin brand-gradient edge on one side — used for the tab bar
     under the header, and mirrored (gradient on top) as the footer at the bottom of the page. */
  .gradient-edge-card{
    border-radius:16px; padding:0 0 5px 0; background:linear-gradient(90deg,var(--purple),var(--pink) 35%,var(--orange) 68%,var(--red) 100%);
  }
  .gradient-edge-card > .inner{
    background:#fff; border-radius:16px 16px 0 0;
  }
  .gradient-edge-card.flip{ padding:5px 0 0 0; }
  .gradient-edge-card.flip > .inner{ border-radius:0 0 16px 16px; }

  nav.tabs{
    display:flex; gap:6px; padding:10px 14px;
  }
  nav.tabs button{
    border:none; background:transparent; color:var(--muted); font-weight:700; font-size:13.5px;
    padding:8px 16px; border-radius:9px; cursor:pointer; transition:.15s;
  }
  nav.tabs button.active{background:var(--ink); color:#fff;}
  nav.tabs button:hover:not(.active){background:var(--card);}

  /* ---------- Controls ---------- */
  .controls{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    padding:14px 32px 0 32px;
  }
  .page-title-inline{font-size:15px; font-weight:800; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .page-title-inline .pill{
    font-size:11px; font-weight:700; color:var(--muted); background:var(--card); border-radius:100px; padding:3px 10px;
  }
  .refresh-btn{
    margin-left:auto; border:1px solid var(--border); background:#fff; border-radius:9px; padding:9px 16px;
    font-weight:700; font-size:13px; cursor:pointer; color:var(--ink);
  }
  .refresh-btn:hover{background:var(--card);}
  .updated-at{font-size:11.5px; color:var(--muted);}

  /* Selector pool: holding pen for the shared Year/Month/Week/Client dropdowns when a page
     doesn't need them — kept out of layout entirely until a page mounts one into its own slot. */
  #selectorPool{display:none;}
  #selectorPool select{
    border:1px solid var(--border); border-radius:9px; padding:7px 10px; font-size:13px; color:var(--ink);
    background:#fff; font-weight:600;
  }

  /* One consolidated control line per page: granularity pill immediately followed by its own
     value dropdown, repeated for Year/Month/Week (or Client), ending with the period-label pill. */
  .control-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:10px 0 22px 0;}
  .control-row .pill-btn{
    border:1px solid var(--border); background:#fff; color:var(--muted); font-weight:700; font-size:12.5px;
    padding:7px 14px; border-radius:8px; cursor:pointer; white-space:nowrap;
  }
  .control-row .pill-btn.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .control-row .pill-btn:hover:not(.active){background:var(--card);}
  .control-row select{
    border:1px solid var(--border); border-radius:9px; padding:7px 10px; font-size:13px; color:var(--ink);
    background:#fff; font-weight:600; margin-right:6px;
  }
  .control-row .field-label{font-size:12.5px; color:var(--muted); font-weight:700; margin-right:2px;}
  .control-row .field-label.active{color:var(--purple); background:#f1e6f5; padding:4px 9px; border-radius:6px;}
  .control-row .period-pill{
    margin-left:auto; font-size:11.5px; font-weight:700; color:var(--muted); background:var(--card);
    border-radius:100px; padding:6px 14px; white-space:nowrap;
  }

  main{padding:10px 32px 48px 32px;}

  /* ---------- Stat cards ---------- */
  .stat-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin:18px 0 26px 0;
  }
  .stat-card{
    background:var(--card); border-radius:12px; padding:16px 18px; border-left:5px solid var(--purple);
  }
  .stat-card .num{font-size:26px; font-weight:800; line-height:1.1;}
  .stat-card .lbl{font-size:12px; color:var(--muted); font-weight:700; margin-top:4px; text-transform:uppercase; letter-spacing:.3px;}
  .stat-card.c1{border-color:var(--purple);}
  .stat-card.c2{border-color:var(--pink);}
  .stat-card.c3{border-color:var(--orange);}
  .stat-card.c4{border-color:var(--red);}
  .stat-card.c5{border-color:var(--teal);}
  .stat-card .num.over{color:var(--red);}
  .stat-card .num.under{color:var(--orange);}
  .stat-card .num.target{color:var(--green);}

  .section-title{font-size:15px; font-weight:800; margin:26px 0 10px 0; display:flex; align-items:center; gap:10px;}
  .section-title .pill{
    font-size:11px; font-weight:700; color:var(--muted); background:var(--card); border-radius:100px; padding:3px 10px;
  }

  /* ---------- Quarter compare ---------- */
  .quarter-compare{
    display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:26px;
  }
  /* Quarter Compare tab: one card per available quarter in the selected year (not just two). */
  .quarters-grid{
    display:flex; flex-wrap:wrap; justify-content:center; gap:16px; margin:0 auto 26px auto; max-width:820px;
  }
  .qcard{border:1px solid var(--border); border-radius:12px; padding:16px 18px;}
  .qcard h3{margin:0 0 10px 0; font-size:13px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted);}
  .qcard .row{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; border-bottom:1px dashed var(--border);}
  .qcard .row:last-child{border-bottom:none;}
  .qcard .row b{font-weight:800;}

  /* ---------- Table ---------- */
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:center; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted);
    padding:10px 12px; border-bottom:2px solid var(--border);
  }
  tbody td{padding:11px 12px; border-bottom:1px solid var(--border); text-align:center;}
  tbody tr:hover{background:var(--card);}
  /* Tables can have more columns than fit a narrow container (e.g. the By Assignee drill-down,
     which sits inside a name-list column) — scroll horizontally instead of clipping columns off. */
  table{min-width:max-content;}
  .badge{
    display:inline-block; padding:3px 10px; border-radius:100px; font-size:11.5px; font-weight:800;
  }
  .badge.over{background:#fde8e2; color:var(--red);}
  .badge.under{background:#fff1dc; color:#b06a00;}
  .badge.target{background:#e2f6ee; color:var(--green);}
  .num-cell{font-variant-numeric:tabular-nums; text-align:center;}
  .brand-name{font-weight:700;}

  .empty, .loading, .error{padding:40px; text-align:center; color:var(--muted); font-size:14px;}
  .error{color:var(--red); font-weight:700;}

  /* ---------- Sub-nav (used inside By Client page) ---------- */
  .subnav{display:flex; gap:6px; margin:0 0 18px 0;}
  .subnav button{
    border:1px solid var(--border); background:#fff; color:var(--muted); font-weight:700; font-size:12.5px;
    padding:7px 14px; border-radius:8px; cursor:pointer;
  }
  .subnav button.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .subnav button:hover:not(.active){background:var(--card);}

  /* ---------- Clickable stat cards + drill-down ---------- */
  .stat-card.clickable{cursor:pointer; position:relative;}
  .stat-card.clickable:hover{filter:brightness(0.97);}
  .stat-card.clickable .hint{font-size:10.5px; color:var(--muted); font-weight:600; margin-top:2px;}
  .drill-panel{border:1px solid var(--border); border-radius:12px; margin:-10px 0 26px 0; overflow-x:auto;}
  .drill-panel .drill-head{
    padding:10px 16px; background:var(--card); font-size:12.5px; font-weight:800; display:flex; justify-content:space-between; align-items:center;
  }
  .drill-panel .drill-close{cursor:pointer; color:var(--muted); font-weight:700;}

  /* ---------- Overview trend table (color-coded + latest-row highlight) ---------- */
  .trend-table td, .trend-table th{padding:9px 12px;}
  .trend-table th.sortable:hover{color:var(--ink); background:var(--card);}
  .trend-table th.sortable{user-select:none;}
  .trend-table th .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px;}
  .dot.over{background:var(--red);} .dot.under{background:var(--orange);} .dot.target{background:var(--green);}
  .text-over{color:var(--red); font-weight:800;}
  .text-under{color:var(--orange); font-weight:800;}
  .text-target{color:var(--green); font-weight:800;}
  .text-zero{color:#c7c9d4; font-weight:600;}
  .trend-table tr.row-latest{background:var(--card);}
  .trend-table tr.row-latest td:first-child{font-weight:800;}
  .latest-pill{font-size:9.5px; font-weight:800; color:var(--purple); background:#f1e6f5; border-radius:100px; padding:2px 8px; margin-left:8px; text-transform:uppercase; letter-spacing:.3px;}
  .ov-num-clickable{cursor:pointer;}
  .ov-num-clickable:hover span{text-decoration:underline;}
  .ov-period-clickable{cursor:pointer;}
  .ov-period-clickable:hover{text-decoration:underline;}
  .overview-drill-row td{padding:0;}

  /* ---------- Snapshot: health bar + top movers ---------- */
  .health-bar{display:flex; height:16px; border-radius:100px; overflow:hidden; background:var(--border); margin:20px 0 12px 0;}
  .health-bar .seg{height:100%;}
  .health-bar .seg.over{background:var(--red);}
  .health-bar .seg.under{background:var(--orange);}
  .health-bar .seg.target{background:var(--green);}
  .health-legend{display:flex; gap:22px; margin-bottom:30px; font-size:13px; font-weight:700; color:var(--ink);}
  .health-legend .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px;}
  .top-lists{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:10px;}
  .top-list{border:1px solid var(--border); border-radius:12px; padding:18px 20px;}
  .top-list h3{margin:0 0 14px 0; font-size:15px; text-transform:uppercase; letter-spacing:.4px;}
  .top-list h3.over{color:var(--red);} .top-list h3.under{color:var(--orange);} .top-list h3.target{color:var(--green);}
  .top-row{display:flex; justify-content:space-between; font-size:16px; padding:9px 0; border-bottom:1px dashed var(--border);}
  .top-row b{font-size:16.5px;}
  .snapshot-name-clickable{cursor:pointer;}
  .snapshot-name-clickable:hover{text-decoration:underline;}
  .snapshot-name-clickable.active{font-weight:800;}
  .top-row:last-child{border-bottom:none;}
  .top-row b.over{color:var(--red);} .top-row b.under{color:var(--orange);}
  .empty.small{padding:14px 0; font-size:13px;}

  /* ---------- By Assignee ---------- */
  .assignee-month-picker{margin:14px 0 20px 0;}
  .assignee-month-picker label{font-size:12.5px; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:8px;}
  .assignee-month-picker select{
    border:1px solid var(--border); border-radius:9px; padding:9px 12px; font-size:13.5px; color:var(--ink); background:#fff; font-weight:600;
  }
  /* By Assignee's own snapshot: one condensed summary line (no cards/icons — declutters vs.
     the previous 4-box KPI grid), a stacked, clickable list of assignee names, and the
     over/under/on-target legend placed right under the summary line (no colored bar). */
  .assignee-kpi-line{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:14px 0 4px 0;}
  .akpi-chip{background:var(--card); border-radius:100px; padding:10px 20px; font-size:13.5px; font-weight:700; color:var(--ink); white-space:nowrap;}
  .akpi-chip b{font-size:16px; font-weight:800; margin-right:5px;}
  .assignee-namelist{display:flex; flex-direction:column; align-items:center; gap:8px; margin:0 auto 26px auto; width:100%;}
  .assignee-name-card{
    display:flex; align-items:center; justify-content:space-between; gap:16px; text-align:left;
    background:var(--card); border-radius:12px; padding:12px 20px; cursor:pointer; transition:.15s;
    width:100%; max-width:900px; white-space:nowrap;
  }
  .assignee-name-card:hover{filter:brightness(0.97);}
  .assignee-name-card.active{box-shadow:0 0 0 2px var(--ink) inset;}
  .an-name{font-size:18px; font-weight:800; line-height:1.2; white-space:nowrap; flex-shrink:0;}
  .an-side{display:flex; align-items:center; gap:16px; flex-shrink:0;}
  .an-count{font-size:13.5px; color:var(--muted); font-weight:700; white-space:nowrap;}
  .an-mix{display:flex; gap:10px; font-size:12.5px; font-weight:700; white-space:nowrap;}
  .assignee-drill-wrap{width:100%; margin:-2px 0 6px 0;}
  /* Multi-brand client groups collapsed into one row inside brand tables (Report page, By
     Assignee drill) — click to expand the individual brands nested beneath. */
  .client-group-row{cursor:pointer; background:var(--card);}
  .client-group-row:hover{filter:brightness(0.97);}
  .client-toggle-arrow{display:inline-block; width:14px; color:var(--muted); font-size:11px;}
  .client-brand-count{color:var(--muted); font-weight:600; font-size:11.5px; margin-left:4px;}
  .brand-subrow .brand-name{padding-left:30px; color:var(--muted); font-weight:600;}
  table.nowrap-cells th, table.nowrap-cells td{white-space:nowrap;}

  /* ---------- Quarter compare: big, obvious metrics + deltas ---------- */
  .qcard{border-left-width:5px; border-left-style:solid; border-left-color:var(--muted); padding:18px 20px; flex:1 1 380px; max-width:400px;}
  .qcard.current{border-left-color:var(--purple);}
  .qcard h3{margin:0 0 14px 0;}
  .qmetric-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px 16px;}
  .qmetric{padding:6px 0;}
  .qval{font-size:26px; font-weight:800; line-height:1.1;}
  .qval.over{color:var(--red);}
  .qval.under{color:var(--orange);}
  .qval.target{color:var(--green);}
  .qval.uo{color:var(--purple);}
  .qlbl{font-size:11.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.3px; margin-top:4px;}
  .qdelta{font-size:12px; color:var(--muted); font-weight:700; white-space:nowrap; margin-top:6px;}

  /* ---------- Footer ---------- */
  footer.site{
    margin:28px 32px 32px 32px;
  }
  footer.site .inner{
    display:flex; align-items:center; justify-content:center; padding:14px;
  }
</style>
</head>
<body>

<header class="site">
  <div class="header-top">
    <div class="logo-row">
      <img src="/logo.png" alt="Giraffe Creatives" />
    </div>
    <div class="brand-row">
      <span class="brand-text">Inspired Creative Solutions</span>
      <span class="bars-icon"><span></span><span></span><span></span><span></span></span>
    </div>
  </div>
  <div class="gradient-edge-card">
    <div class="inner">
      <nav class="tabs" id="periodTabs">
        <button data-tab="report" class="active">Report</button>
        <button data-tab="snapshot">Snapshot</button>
        <button data-tab="overview">Overview</button>
        <button data-tab="qcompare">Quarter Compare</button>
        <button data-tab="client">By Client</button>
        <button data-tab="assignee">By Assignee</button>
      </nav>
    </div>
  </div>
</header>

<div class="controls" id="controlsBar">
  <div class="page-title-inline">Media Buying — Spend Pacing Report <span class="pill">Approved budget vs. actual spend across all brands</span></div>
  <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
</div>

<!-- Holding pen for the shared selectors: hidden by default (display:none), each page moves the
     ones it needs into a slot inside its own single control-row. -->
<div id="selectorPool">
  <span id="clientWrap"><select id="clientSelect"></select></span>
  <span id="yearWrap"><select id="yearSelect"></select></span>
  <span id="monthWrap"><select id="monthSelect"></select></span>
  <span id="weekWrap">
    <select id="weekSelect">
      <option value="1">Week 1</option>
      <option value="2">Week 2</option>
      <option value="3">Week 3</option>
      <option value="4">Week 4</option>
      <option value="5" selected>Week 5</option>
    </select>
  </span>
</div>

<main>
  <div id="content" class="loading">Loading live data from ClickUp…</div>
</main>

<footer class="site">
  <div class="gradient-edge-card flip">
    <div class="inner" style="height:18px"></div>
  </div>
</footer>

<script>
(function(){
  const state = { tab: "report", reportGranularity: "year", data: null, year: null, month: null, week: 5, tolerance: 5,
    clientPeriod: "year", selectedClientGroup: null, clientBrandFilter: null,
    drillStatus: null, lastRows: [],
    assigneePeriod: null, drillAssignee: null, assigneeGranularity: "month", assigneeWeek: 5,
    overviewSort: { key: "period", dir: "desc" }, expandedClientGroups: new Set(), overviewDrill: null,
    assigneeGroupBy: "assignee", drillClient: null, overviewRange: "all", snapshotDrillBrand: null };

  const contentEl = document.getElementById("content");
  const selectorPool = document.getElementById("selectorPool");
  const yearSelect = document.getElementById("yearSelect");
  const monthSelect = document.getElementById("monthSelect");
  const weekSelect = document.getElementById("weekSelect");
  const clientSelect = document.getElementById("clientSelect");
  const yearWrap = document.getElementById("yearWrap");
  const monthWrap = document.getElementById("monthWrap");
  const weekWrap = document.getElementById("weekWrap");
  const clientWrap = document.getElementById("clientWrap");
  const refreshBtn = document.getElementById("refreshBtn");

  // The Year/Month/Week/Client selectors are shared DOM nodes physically relocated into whichever
  // page needs them. Parking them all back in the hidden pool first (before any innerHTML wipe)
  // is what lets each page mount only the ones it needs into its own single control-row.
  function parkAllSelectors(){
    selectorPool.appendChild(clientWrap);
    selectorPool.appendChild(yearWrap);
    selectorPool.appendChild(monthWrap);
    selectorPool.appendChild(weekWrap);
  }
  function mount(wrap, slotId, display){
    const slot = document.getElementById(slotId);
    if(!slot) return;
    wrap.style.display = display || "inline-flex";
    slot.appendChild(wrap);
  }

  const MONTH_NAMES = ["","January","February","March","April","May","June","July","August","September","October","November","December"];

  // Every Media Buying tracker list is named "<Month> <Year>_Tracker" — the calendar coverage is
  // known up front from the list names themselves, so the Year/Month/Week pickers don't need to
  // wait on the ClickUp fetch to populate. This mirrors LISTS in api/report.js.
  const PERIODS = [];
  for(let m=3;m<=12;m++) PERIODS.push({year:2024, month:m});
  for(let m=1;m<=12;m++) PERIODS.push({year:2025, month:m});
  for(let m=1;m<=7;m++) PERIODS.push({year:2026, month:m});

  function fmtMoney(n){
    if(n === null || n === undefined || !isFinite(n)) return "—";
    const sign = n < 0 ? "-" : "";
    return sign + "$" + Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:0});
  }
  function fmtPct(n){
    if(n === null || n === undefined || !isFinite(n)) return "—";
    return n.toFixed(1) + "%";
  }

  function classify(usagePct, tolerance){
    if(usagePct === null || usagePct === undefined || !isFinite(usagePct)) return "n/a";
    if(usagePct > 100 + tolerance) return "Overspend";
    if(usagePct < 100 - tolerance) return "Underspend";
    return "On Target";
  }

  function badgeClass(status){
    if(status === "Overspend") return "over";
    if(status === "Underspend") return "under";
    if(status === "On Target") return "target";
    return "";
  }

  // Build per-brand rows (approved, actual, uoSpend, usagePct, status) for a set of month entries,
  // aggregated together (summed) — used for Year view and for pooling a quarter.
  function aggregateBrands(monthEntries, tolerance){
    const map = new Map();
    for(const m of monthEntries){
      for(const b of m.brands){
        if(!map.has(b.name)) map.set(b.name, {name:b.name, approved:0, actual:0, assignees:new Set(), client:b.client||b.name});
        const agg = map.get(b.name);
        agg.approved += b.approved;
        agg.actual += b.actual;
        (b.assignees||[]).forEach(a=>agg.assignees.add(a));
      }
    }
    const rows = [...map.values()].map(r=>{
      const uoSpend = r.approved - r.actual;
      const usagePct = r.approved > 0 ? (r.actual / r.approved * 100) : (r.actual > 0 ? Infinity : null);
      const status = classify(usagePct, tolerance);
      return {...r, assignees:[...r.assignees], uoSpend, usagePct, status};
    });
    rows.sort((a,b)=> a.name.localeCompare(b.name));
    return rows;
  }

  // Week view: cumulative spend through week N vs prorated target.
  function weekBrands(monthEntry, week, tolerance){
    if(!monthEntry) return [];
    const rows = monthEntry.brands.map(b=>{
      const cum = b.weeks.slice(0, week).reduce((a,c)=>a+c,0);
      const target = b.approved * (week/5);
      const uoSpend = target - cum;
      const usagePct = target > 0 ? (cum/target*100) : (cum>0?Infinity:null);
      const status = classify(usagePct, tolerance);
      return {name:b.name, approved:target, actual:cum, uoSpend, usagePct, status, assignees:b.assignees||[], client:b.client||b.name};
    });
    rows.sort((a,b)=>a.name.localeCompare(b.name));
    return rows;
  }

  // Client-level rollup: groups brands by the ClickUp "Client / Brand" field (e.g. every
  // "Trade Kings..." brand rolls up under client "Trade Kings"; "Access Bank", "Access Bank
  // Linkedin", "Access Bank W Community" all roll up under client "Access Bank"). Keeps the
  // underlying per-brand breakdown too, so the client view can still show what it's made of.
  function aggregateByClient(monthEntries, tolerance){
    const map = new Map();
    for(const m of monthEntries){
      for(const b of m.brands){
        const clientName = b.client || b.name;
        if(!map.has(clientName)) map.set(clientName, {name:clientName, approved:0, actual:0, assignees:new Set(), brands:new Map()});
        const agg = map.get(clientName);
        agg.approved += b.approved;
        agg.actual += b.actual;
        (b.assignees||[]).forEach(a=>agg.assignees.add(a));
        if(!agg.brands.has(b.name)) agg.brands.set(b.name, {name:b.name, approved:0, actual:0});
        const bagg = agg.brands.get(b.name);
        bagg.approved += b.approved;
        bagg.actual += b.actual;
      }
    }
    const rows = [...map.values()].map(r=>{
      const uoSpend = r.approved - r.actual;
      const usagePct = r.approved > 0 ? (r.actual / r.approved * 100) : (r.actual > 0 ? Infinity : null);
      const status = classify(usagePct, tolerance);
      const brands = [...r.brands.values()].sort((a,b)=>a.name.localeCompare(b.name));
      return {name:r.name, approved:r.approved, actual:r.actual, assignees:[...r.assignees], uoSpend, usagePct, status, brands};
    });
    rows.sort((a,b)=>a.name.localeCompare(b.name));
    return rows;
  }

  // Client-level rollup for a single week-to-date view of one month.
  function weekBrandsByClient(monthEntry, week, tolerance){
    if(!monthEntry) return [];
    const map = new Map();
    for(const b of monthEntry.brands){
      const clientName = b.client || b.name;
      const cum = b.weeks.slice(0, week).reduce((a,c)=>a+c,0);
      const target = b.approved * (week/5);
      if(!map.has(clientName)) map.set(clientName, {name:clientName, approved:0, actual:0, assignees:new Set(), brands:new Map()});
      const agg = map.get(clientName);
      agg.approved += target;
      agg.actual += cum;
      (b.assignees||[]).forEach(a=>agg.assignees.add(a));
      if(!agg.brands.has(b.name)) agg.brands.set(b.name, {name:b.name, approved:0, actual:0});
      const bagg = agg.brands.get(b.name);
      bagg.approved += target;
      bagg.actual += cum;
    }
    const rows = [...map.values()].map(r=>{
      const uoSpend = r.approved - r.actual;
      const usagePct = r.approved > 0 ? (r.actual / r.approved * 100) : (r.actual > 0 ? Infinity : null);
      const status = classify(usagePct, tolerance);
      const brands = [...r.brands.values()].sort((a,b)=>a.name.localeCompare(b.name));
      return {name:r.name, approved:r.approved, actual:r.actual, assignees:[...r.assignees], uoSpend, usagePct, status, brands};
    });
    rows.sort((a,b)=>a.name.localeCompare(b.name));
    return rows;
  }

  // The ClickUp sheet's own follow-on formulas, re-derived from approved/actual/usage% so they
  // work consistently at every granularity (year aggregate, single month, or week-to-date) —
  // not just when reading one raw ClickUp task. Verified to match ClickUp's cached field values.
  function sheetFields(row){
    const cumSpend = row.actual;
    const uoSpend = row.uoSpend;
    const currentUsagePct = row.usagePct;
    const targetUsagePct = 100;
    let newWeeklyUsagePct = null, newWeeklyAmount = null;
    if(currentUsagePct !== null && isFinite(currentUsagePct)){
      newWeeklyUsagePct = Math.round(100 - currentUsagePct);
      newWeeklyAmount = Math.ceil((100 - currentUsagePct) * row.approved * 10);
    }
    return { cumSpend, uoSpend, currentUsagePct, targetUsagePct, newWeeklyUsagePct, newWeeklyAmount };
  }

  // Assignee tracking only became reliable starting the July 2026 tracker.
  function isAssigneeEligible(year, month){
    return year > 2026 || (year === 2026 && month >= 7);
  }

  function statsOf(rows){
    const over = rows.filter(r=>r.status==="Overspend");
    const under = rows.filter(r=>r.status==="Underspend");
    const target = rows.filter(r=>r.status==="On Target");
    const mean = (arr, fn) => arr.length ? arr.reduce((a,r)=>a+fn(r),0)/arr.length : null;
    return {
      overCount: over.length,
      underCount: under.length,
      targetCount: target.length,
      avgOverspend: mean(over, r=>Math.abs(r.uoSpend)),
      avgUnderspend: mean(under, r=>r.uoSpend),
      avgOnTarget: mean(target, r=>Math.abs(r.uoSpend)),
      avgUOSpend: mean(rows, r=>r.uoSpend),
    };
  }

  function firstName(name){
    if(!name) return name;
    return name.split(/\s+/)[0];
  }

  // Groups already-computed brand rows (from aggregateBrands/weekBrands — both of which have
  // approved/actual/uoSpend/client already worked out for the current period/granularity) by the
  // ClickUp client they roll up to. Clients with more than one brand get a summed group row that
  // a table can render as a single collapsible line (e.g. "Trade Kings — 18 brands"); clients
  // with just one brand are returned as a single-brand group so callers can render them plainly.
  function groupRowsByClient(rows, tolerance){
    const map = new Map();
    for(const r of rows){
      const client = r.client || r.name;
      if(!map.has(client)) map.set(client, []);
      map.get(client).push(r);
    }
    return [...map.entries()].map(([client, brands])=>{
      const approved = brands.reduce((a,b)=>a+b.approved,0);
      const actual = brands.reduce((a,b)=>a+b.actual,0);
      const uoSpend = approved - actual;
      const usagePct = approved > 0 ? (actual/approved*100) : (actual>0?Infinity:null);
      const status = classify(usagePct, tolerance);
      const assignees = [...new Set(brands.flatMap(b=>b.assignees||[]))];
      brands.sort((a,b)=>a.name.localeCompare(b.name));
      return { client, brands, approved, actual, uoSpend, usagePct, status, assignees };
    }).sort((a,b)=>a.client.localeCompare(b.client));
  }

  function quarterOf(month){ return Math.floor((month-1)/3)+1; }
  function prevQuarter(year, quarter){
    return quarter === 1 ? {year:year-1, quarter:4} : {year, quarter:quarter-1};
  }
  function monthsInQuarter(year, quarter){
    const start = (quarter-1)*3+1;
    return [start, start+1, start+2].map(m=>({year, month:m}));
  }

  function getMonthEntry(year, month){
    if(!state.data) return null;
    return state.data.months.find(m=>m.year===year && m.month===month) || null;
  }

  function cumulativeAvgUOSpend(uptoYear, uptoMonth){
    if(!state.data) return null;
    // Running average of each period's overall Avg U/O Spend, across all months up to and including the one given.
    const months = state.data.months.filter(m => (m.year < uptoYear) || (m.year===uptoYear && m.month<=uptoMonth));
    if(!months.length) return null;
    const perMonthAvg = months.map(m=>{
      const rows = aggregateBrands([m], state.tolerance);
      return statsOf(rows).avgUOSpend;
    }).filter(v=>v!==null && isFinite(v));
    if(!perMonthAvg.length) return null;
    return perMonthAvg.reduce((a,b)=>a+b,0)/perMonthAvg.length;
  }

  function renderStatCards(stats, cumAvg, opts){
    const clickable = !opts || opts.clickable !== false;
    const cards = [
      {cls:"c4", numCls:"over", label:"Overspend", value: stats.overCount + " brands", status:"Overspend"},
      {cls:"c3", numCls:"under", label:"Underspend", value: stats.underCount + " brands", status:"Underspend"},
      {cls:"c5", numCls:"target", label:"On Target", value: stats.targetCount + " brands", status:"On Target"},
      {cls:"c1", numCls:"", label:"Avg U/O Spend", value: fmtMoney(stats.avgUOSpend), status:null},
      {cls:"c2", numCls:"", label:"CUM AVG U/O Spend", value: fmtMoney(cumAvg), status:null},
    ];
    const clickableCards = clickable ? cards.filter(c=>c.status) : [];
    const html = `<div class="stat-grid">${cards.map(c=>{
      const isClickable = clickable && c.status;
      return `
      <div class="stat-card ${c.cls}${isClickable ? " clickable" : ""}" ${isClickable ? `data-status="${c.status}"` : ""}>
        <div class="num ${c.numCls}">${c.value}</div>
        <div class="lbl">${c.label}</div>
        ${isClickable ? `<div class="hint">Click to view brands ›</div>` : ""}
      </div>`;
    }).join("")}</div>
      ${state.drillStatus ? renderDrillPanel(state.drillStatus) : ""}
      <div class="stat-grid">
        <div class="stat-card c4"><div class="num over">${fmtMoney(stats.avgOverspend)}</div><div class="lbl">Avg Overspend</div></div>
        <div class="stat-card c3"><div class="num under">${fmtMoney(stats.avgUnderspend)}</div><div class="lbl">Avg Underspend</div></div>
        <div class="stat-card c5"><div class="num target">${fmtMoney(stats.avgOnTarget)}</div><div class="lbl">Avg On Target</div></div>
      </div>`;
    return html;
  }

  // Inline drop-down list of brands belonging to the clicked status, drawn from whatever
  // rows the currently-rendered view last computed (state.lastRows).
  function renderDrillPanel(status){
    const rows = state.lastRows.filter(r=>r.status===status);
    return `<div class="drill-panel">
      <div class="drill-head">
        <span>${status} — ${rows.length} brand${rows.length===1?"":"s"}</span>
        <span class="drill-close" data-drill-close="1">Close ✕</span>
      </div>
      ${rows.length ? `<table class="nowrap-cells">
        <thead><tr><th>Brand</th><th class="num-cell">U/O Spend $</th><th class="num-cell">Usage %</th></tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td class="brand-name">${r.name}</td>
          <td class="num-cell">${fmtMoney(r.uoSpend)}</td>
          <td class="num-cell">${fmtPct(r.usagePct)}</td>
        </tr>`).join("")}</tbody>
      </table>` : `<div class="empty">No brands in this category.</div>`}
    </div>`;
  }

  function renderQuarterCompare(currentStats, prevStats, curLabel, prevLabel){
    function deltaHtml(curVal, prevVal){
      if(curVal===null||prevVal===null||!isFinite(curVal)||!isFinite(prevVal)) return "";
      const d = curVal - prevVal;
      if(Math.abs(d) < 0.5) return `<div class="qdelta">no change vs prev</div>`;
      return `<div class="qdelta">${d>0?"▲ +":"▼ -"}${fmtMoney(Math.abs(d))} vs prev</div>`;
    }
    function metrics(s, isCurrent){
      const list = [
        {label:"Avg Overspend", val:s.avgOverspend, prevVal:prevStats.avgOverspend, cls:"over"},
        {label:"Avg Underspend", val:s.avgUnderspend, prevVal:prevStats.avgUnderspend, cls:"under"},
        {label:"Avg On Target", val:s.avgOnTarget, prevVal:prevStats.avgOnTarget, cls:"target"},
        {label:"Avg U/O Spend", val:s.avgUOSpend, prevVal:prevStats.avgUOSpend, cls:"uo"},
      ];
      return `<div class="qmetric-grid">${list.map(m=>`
        <div class="qmetric">
          <div class="qval ${m.cls}">${fmtMoney(m.val)}</div>
          <div class="qlbl">${m.label}</div>
          ${isCurrent ? deltaHtml(m.val, m.prevVal) : ""}
        </div>`).join("")}</div>`;
    }
    return `<div class="section-title">Quarter comparison <span class="pill">${prevLabel} vs ${curLabel}</span></div>
      <div class="quarter-compare">
        <div class="qcard"><h3>${prevLabel} (Previous Quarter Avgs)</h3>${metrics(prevStats,false)}</div>
        <div class="qcard current"><h3>${curLabel} (Current Quarter)</h3>${metrics(currentStats,true)}</div>
      </div>`;
  }

  // Columns mirror the ClickUp tracker sheet itself: Approved, CUM Spend, U/O Spend, Current
  // Usage %, Target Usage %, New Weekly Usage %, New Weekly Amount $, Status — plus Assignee
  // for periods where that's tracked (July 2026 onward).
  // One brand's <tr> in the Report table — shared by both top-level single-brand clients and
  // the nested rows shown when a multi-brand client group is expanded.
  function renderBrandRow(r, showAssignee, nested){
    const sf = sheetFields(r);
    return `<tr class="${nested?"brand-subrow":""}">
      <td class="brand-name">${r.name}</td>
      ${showAssignee ? `<td>${(r.assignees && r.assignees.length) ? r.assignees.join(", ") : "—"}</td>` : ""}
      <td class="num-cell">${fmtMoney(r.approved)}</td>
      <td class="num-cell">${fmtMoney(sf.cumSpend)}</td>
      <td class="num-cell">${fmtMoney(sf.uoSpend)}</td>
      <td class="num-cell">${fmtPct(sf.currentUsagePct)}</td>
      <td class="num-cell">${sf.targetUsagePct}%</td>
      <td class="num-cell">${sf.newWeeklyUsagePct===null?"—":sf.newWeeklyUsagePct+"%"}</td>
      <td class="num-cell">${sf.newWeeklyAmount===null?"—":fmtMoney(sf.newWeeklyAmount)}</td>
      <td><span class="badge ${badgeClass(r.status)}">${r.status}</span></td>
    </tr>`;
  }

  // Client-level summary <tr> for a multi-brand client group, with a toggle to expand/collapse
  // the individual brand rows nested underneath it (e.g. "Trade Kings — 18 brands").
  function renderClientGroupRow(g, showAssignee){
    const isOpen = state.expandedClientGroups.has(g.client);
    const sf = sheetFields(g);
    return `<tr class="client-group-row" data-toggle-client="${g.client}">
      <td class="brand-name"><span class="client-toggle-arrow">${isOpen?"▾":"▸"}</span>${g.client} <span class="client-brand-count">${g.brands.length} brands</span></td>
      ${showAssignee ? `<td>${(g.assignees && g.assignees.length) ? g.assignees.join(", ") : "—"}</td>` : ""}
      <td class="num-cell">${fmtMoney(g.approved)}</td>
      <td class="num-cell">${fmtMoney(sf.cumSpend)}</td>
      <td class="num-cell">${fmtMoney(sf.uoSpend)}</td>
      <td class="num-cell">${fmtPct(sf.currentUsagePct)}</td>
      <td class="num-cell">${sf.targetUsagePct}%</td>
      <td class="num-cell">${sf.newWeeklyUsagePct===null?"—":sf.newWeeklyUsagePct+"%"}</td>
      <td class="num-cell">${sf.newWeeklyAmount===null?"—":fmtMoney(sf.newWeeklyAmount)}</td>
      <td><span class="badge ${badgeClass(g.status)}">${g.status}</span></td>
    </tr>${isOpen ? g.brands.map(r=>renderBrandRow(r, showAssignee, true)).join("") : ""}`;
  }

  function renderTable(rows, approvedLabel, opts){
    const showAssignee = !!(opts && opts.showAssignee);
    if(!rows.length) return `<div class="empty">No brands with tracked spend in this period.</div>`;
    const groups = groupRowsByClient(rows, state.tolerance);
    return `<table class="nowrap-cells">
      <thead><tr>
        <th>Brand / Client</th>${showAssignee ? `<th>Assignee</th>` : ""}
        <th class="num-cell">${approvedLabel}</th>
        <th class="num-cell">CUM Spend</th>
        <th class="num-cell">U/O Spend $</th>
        <th class="num-cell">Current Usage %</th>
        <th class="num-cell">Target Usage %</th>
        <th class="num-cell">New Weekly Usage %</th>
        <th class="num-cell">New Weekly Amount $</th>
        <th>Status</th>
      </tr></thead>
      <tbody>
        ${groups.map(g => g.brands.length > 1 ? renderClientGroupRow(g, showAssignee) : renderBrandRow(g.brands[0], showAssignee, false)).join("")}
      </tbody>
    </table>`;
  }

  function render(){
    // Always park the shared selectors back in the hidden pool first — safe even if they're
    // already there, and required before wiping innerHTML on a page that had them mounted in it.
    parkAllSelectors();
    if(!state.data){ contentEl.innerHTML = `<div class="loading">Loading live data from ClickUp…</div>`; return; }

    if(state.tab === "snapshot") return renderSnapshotPage();
    if(state.tab === "overview") return renderOverviewPage();
    if(state.tab === "qcompare") return renderQuarterComparePage();
    if(state.tab === "client") return renderClientPage();
    if(state.tab === "assignee") return renderAssigneePage();
    return renderReportPage();
  }

  // ---------- Report: the original Year / Month / Week views, unified under one tab with its
  // own internal granularity toggle (instead of three separate top-level tabs) so the same
  // "Year/Month/Week" wording only ever appears in one place on screen. ----------
  function renderReportPage(){
    const tolerance = state.tolerance;
    let rows, statLabel, curQuarterLabel, curStats, prevStats, prevLabel, cumAvg, approvedLabel="Approved Spend";
    const g = state.reportGranularity;

    if(g === "year"){
      const monthsInYear = state.data.months.filter(m=>m.year===state.year);
      rows = aggregateBrands(monthsInYear, tolerance);
      curStats = statsOf(rows);
      cumAvg = cumulativeAvgUOSpend(state.year, 12);
      // quarter compare not very meaningful at year granularity -> compare last quarter of this year vs previous
      const q = 4;
      const curQMonths = monthsInQuarter(state.year, q).map(({year,month})=>getMonthEntry(year,month)).filter(Boolean);
      const pq = prevQuarter(state.year, q);
      const prevQMonths = monthsInQuarter(pq.year, pq.quarter).map(({year,month})=>getMonthEntry(year,month)).filter(Boolean);
      curStats = curQMonths.length ? statsOf(aggregateBrands(curQMonths, tolerance)) : statsOf(rows);
      prevStats = statsOf(aggregateBrands(prevQMonths, tolerance));
      curQuarterLabel = curQMonths.length ? `Q${q} ${state.year}` : `FY${state.year}`;
      prevLabel = `Q${pq.quarter} ${pq.year}`;
      statLabel = `${state.year} — full year`;
    } else if(g === "month"){
      const m = getMonthEntry(state.year, state.month);
      rows = m ? aggregateBrands([m], tolerance) : [];
      curStats = statsOf(rows);
      cumAvg = cumulativeAvgUOSpend(state.year, state.month);
      const q = quarterOf(state.month);
      const pq = prevQuarter(state.year, q);
      const prevQMonths = monthsInQuarter(pq.year, pq.quarter).map(({year,month})=>getMonthEntry(year,month)).filter(Boolean);
      prevStats = statsOf(aggregateBrands(prevQMonths, tolerance));
      curQuarterLabel = `Q${q} ${state.year}`;
      prevLabel = `Q${pq.quarter} ${pq.year}`;
      statLabel = `${MONTH_NAMES[state.month]} ${state.year}`;
    } else {
      const m = getMonthEntry(state.year, state.month);
      rows = weekBrands(m, state.week, tolerance);
      curStats = statsOf(rows);
      cumAvg = cumulativeAvgUOSpend(state.year, state.month);
      const q = quarterOf(state.month);
      const pq = prevQuarter(state.year, q);
      const prevQMonths = monthsInQuarter(pq.year, pq.quarter).map(({year,month})=>getMonthEntry(year,month)).filter(Boolean);
      prevStats = statsOf(aggregateBrands(prevQMonths, tolerance));
      curQuarterLabel = `Q${q} ${state.year}`;
      prevLabel = `Q${pq.quarter} ${pq.year}`;
      statLabel = `${MONTH_NAMES[state.month]} ${state.year} — through Week ${state.week}`;
      approvedLabel = `Prorated Target (Wk ${state.week})`;
    }

    state.lastRows = rows;
    const showAssignee = g==="year" ? state.year>=2026 : isAssigneeEligible(state.year, state.month);
    contentEl.innerHTML = `
      <div class="section-title" style="margin-top:2px">Report</div>
      <div class="control-row">
        <button class="pill-btn ${g==="year"?"active":""}" data-reportperiod="year">Year</button>
        <span id="rpYearSlot"></span>
        <button class="pill-btn ${g==="month"?"active":""}" data-reportperiod="month">Month</button>
        <span id="rpMonthSlot"></span>
        <button class="pill-btn ${g==="week"?"active":""}" data-reportperiod="week">Week</button>
        <span id="rpWeekSlot"></span>
        <span class="period-pill">${statLabel} · ${rows.length} brands tracked</span>
      </div>
      ${renderStatCards(curStats, cumAvg)}
      ${renderQuarterCompare(curStats, prevStats, curQuarterLabel, prevLabel)}
      <div class="section-title">Brand detail</div>
      ${renderTable(rows, approvedLabel, {showAssignee})}
    `;
    // The Year/Month/Week value selectors always stay visible here, paired inline with their own pill.
    mount(yearWrap, "rpYearSlot");
    mount(monthWrap, "rpMonthSlot");
    mount(weekWrap, "rpWeekSlot");
  }

  // ---------- Snapshot: a genuinely different, at-a-glance concise summary ----------
  // (a proportion bar + biggest movers — deliberately NOT the same stat-cards/quarter-compare
  // layout used by Year/Month/Week, so this page tells you something new in one glance.)
  function latestAvailableMonth(){
    if(!state.data || !state.data.months.length) return null;
    return state.data.months[state.data.months.length-1];
  }
  function renderSnapshotPage(){
    const m = latestAvailableMonth();
    if(!m){ contentEl.innerHTML = `<div class="empty">No data available yet.</div>`; return; }
    const tolerance = state.tolerance;
    const rows = aggregateBrands([m], tolerance);
    const stats = statsOf(rows);
    const total = rows.length || 1;
    const overPct = stats.overCount/total*100;
    const underPct = stats.underCount/total*100;
    const targetPct = stats.targetCount/total*100;

    const topOver = rows.filter(r=>r.status==="Overspend").sort((a,b)=>a.uoSpend-b.uoSpend).slice(0,5);
    const topUnder = rows.filter(r=>r.status==="Underspend").sort((a,b)=>b.uoSpend-a.uoSpend).slice(0,5);
    const topTarget = rows.filter(r=>r.status==="On Target").sort((a,b)=>Math.abs(a.uoSpend)-Math.abs(b.uoSpend)).slice(0,5);

    // Click a brand's name in any of the three lists to expand an inline detail card right
    // underneath it — same click-to-open-details pattern used everywhere else in the app.
    function snapshotBrandDetail(r){
      return `<div class="drill-panel" style="margin:0 0 10px 0;">
        <div class="drill-head"><span>${r.name} — details</span></div>
        <div style="padding:12px 16px; display:grid; grid-template-columns:1fr 1fr; gap:10px 20px; font-size:13.5px; text-align:left;">
          <div><span style="color:var(--muted); font-weight:700;">Client</span><br><b>${r.client||r.name}</b></div>
          <div><span style="color:var(--muted); font-weight:700;">Status</span><br><span class="badge ${badgeClass(r.status)}">${r.status}</span></div>
          <div><span style="color:var(--muted); font-weight:700;">Approved</span><br><b>${fmtMoney(r.approved)}</b></div>
          <div><span style="color:var(--muted); font-weight:700;">Actual</span><br><b>${fmtMoney(r.actual)}</b></div>
          <div><span style="color:var(--muted); font-weight:700;">U/O Spend $</span><br><b>${fmtMoney(r.uoSpend)}</b></div>
          <div><span style="color:var(--muted); font-weight:700;">Usage %</span><br><b>${fmtPct(r.usagePct)}</b></div>
          <div style="grid-column:1/-1;"><span style="color:var(--muted); font-weight:700;">Assignee</span><br><b>${(r.assignees&&r.assignees.length)?r.assignees.join(", "):"—"}</b></div>
        </div>
      </div>`;
    }
    function snapshotRow(r, colorCls){
      const isActive = state.snapshotDrillBrand === r.name;
      return `<div class="top-row"><span class="snapshot-name-clickable${isActive?" active":""}" data-snapname="${r.name}">${r.name}</span><b class="${colorCls}">${fmtMoney(r.uoSpend)}</b></div>
        ${isActive ? snapshotBrandDetail(r) : ""}`;
    }

    state.lastRows = rows;
    contentEl.innerHTML = `
      <div class="section-title">Snapshot <span class="pill">${MONTH_NAMES[m.month]} ${m.year} — most recent period</span></div>
      <div class="health-bar">
        ${stats.overCount ? `<div class="seg over" style="width:${Math.max(overPct,2.5)}%" title="${stats.overCount} Overspend"></div>` : ""}
        ${stats.underCount ? `<div class="seg under" style="width:${Math.max(underPct,2.5)}%" title="${stats.underCount} Underspend"></div>` : ""}
        ${stats.targetCount ? `<div class="seg target" style="width:${Math.max(targetPct,2.5)}%" title="${stats.targetCount} On Target"></div>` : ""}
      </div>
      ${stats.targetCount ? `<div style="display:flex; justify-content:flex-end; margin:-6px 0 10px 0;">
        <span style="font-size:11px; font-weight:800; color:var(--green); background:#e2f6ee; border-radius:100px; padding:3px 10px;">▲ ${stats.targetCount} On Target</span>
      </div>` : ""}
      <div class="health-legend">
        <span><i class="dot over"></i>${stats.overCount} Overspend</span>
        <span><i class="dot under"></i>${stats.underCount} Underspend</span>
        <span><i class="dot target"></i>${stats.targetCount} On Target</span>
        <span style="color:var(--muted); font-weight:600;">out of ${rows.length} brands tracked</span>
      </div>
      <div class="top-list" style="margin-bottom:16px;">
        <h3 class="target">On Target</h3>
        ${topTarget.length ? topTarget.map(r=>snapshotRow(r,"text-target")).join("") : `<div class="empty small">No brands on target this period.</div>`}
      </div>
      <div class="top-lists">
        <div class="top-list">
          <h3 class="over">Biggest Overspends</h3>
          ${topOver.length ? topOver.map(r=>snapshotRow(r,"over")).join("") : `<div class="empty small">No overspends this period.</div>`}
        </div>
        <div class="top-list">
          <h3 class="under">Biggest Underspends</h3>
          ${topUnder.length ? topUnder.map(r=>snapshotRow(r,"under")).join("") : `<div class="empty small">No underspends this period.</div>`}
        </div>
      </div>
    `;
  }

  // ---------- Overview: all-time trend across every period, one row per month, color-coded,
  // sortable by any column (defaults to descending whenever you switch columns), with a
  // snapshot bar up top showing the latest period at a glance. ----------
  // Inline drop-down (matching renderDrillPanel's look) shown directly under one Overview trend
  // row when its Overspend/Underspend/On Target count is clicked — lists the brands that made up
  // that count for that specific period.
  function renderOverviewDrillRow(year, month, status, colspan){
    const m = state.data.months.find(x=>x.year===year && x.month===month);
    const rows = m ? aggregateBrands([m], state.tolerance).filter(r=>r.status===status) : [];
    return `<tr class="overview-drill-row">
      <td colspan="${colspan}">
        <div class="drill-panel" style="margin:6px 0;">
          <div class="drill-head">
            <span>${MONTH_NAMES[month]} ${year} — ${status} — ${rows.length} brand${rows.length===1?"":"s"}</span>
            <span class="drill-close" data-drill-close="overview">Close ✕</span>
          </div>
          ${rows.length ? `<table class="nowrap-cells">
            <thead><tr><th>Brand</th><th class="num-cell">U/O Spend $</th><th class="num-cell">Usage %</th></tr></thead>
            <tbody>${rows.map(r=>`<tr>
              <td class="brand-name">${r.name}</td>
              <td class="num-cell">${fmtMoney(r.uoSpend)}</td>
              <td class="num-cell">${fmtPct(r.usagePct)}</td>
            </tr>`).join("")}</tbody>
          </table>` : `<div class="empty">No brands in this category.</div>`}
        </div>
      </td>
    </tr>`;
  }

  // Clicking a period's own label (instead of one of its status counts) opens every client active
  // that month, client-grouped — multi-brand clients get a toggle to expand their brands nested
  // underneath (reusing the same [data-toggle-client] mechanism as the Report/Assignee tables,
  // namespaced with an "ov:" prefix so it doesn't collide with those pages' own expand state);
  // single-brand clients render as a plain, non-clickable row since there's nothing to expand.
  function renderOverviewClientBrandRow(r, nested){
    return `<tr class="${nested?"brand-subrow":""}">
      <td class="brand-name">${r.name}</td>
      <td class="num-cell">${fmtMoney(r.approved)}</td>
      <td class="num-cell">${fmtMoney(r.actual)}</td>
      <td class="num-cell"><span class="${r.status==="Overspend"?"text-over":r.status==="Underspend"?"text-under":"text-target"}">${fmtMoney(r.uoSpend)}</span></td>
      <td class="num-cell">${fmtPct(r.usagePct)}</td>
      <td><span class="badge ${badgeClass(r.status)}">${r.status}</span></td>
    </tr>`;
  }
  function renderOverviewClientGroupRow(g){
    const key = "ov:" + g.client;
    const isOpen = state.expandedClientGroups.has(key);
    return `<tr class="client-group-row" data-toggle-client="${key}">
      <td class="brand-name"><span class="client-toggle-arrow">${isOpen?"▾":"▸"}</span>${g.client} <span class="client-brand-count">${g.brands.length} brands</span></td>
      <td class="num-cell">${fmtMoney(g.approved)}</td>
      <td class="num-cell">${fmtMoney(g.actual)}</td>
      <td class="num-cell"><span class="${g.status==="Overspend"?"text-over":g.status==="Underspend"?"text-under":"text-target"}">${fmtMoney(g.uoSpend)}</span></td>
      <td class="num-cell">${fmtPct(g.usagePct)}</td>
      <td><span class="badge ${badgeClass(g.status)}">${g.status}</span></td>
    </tr>${isOpen ? g.brands.map(r=>renderOverviewClientBrandRow(r, true)).join("") : ""}`;
  }
  function renderOverviewClientsDrillRow(year, month, colspan){
    const m = state.data.months.find(x=>x.year===year && x.month===month);
    const rows = m ? aggregateBrands([m], state.tolerance) : [];
    const groups = groupRowsByClient(rows, state.tolerance);
    return `<tr class="overview-drill-row">
      <td colspan="${colspan}">
        <div class="drill-panel" style="margin:6px 0;">
          <div class="drill-head">
            <span>${MONTH_NAMES[month]} ${year} — All Clients — ${groups.length} client${groups.length===1?"":"s"}</span>
            <span class="drill-close" data-drill-close="overview">Close ✕</span>
          </div>
          ${groups.length ? `<table class="nowrap-cells">
            <thead><tr><th>Client / Brand</th><th class="num-cell">Approved</th><th class="num-cell">Actual</th><th class="num-cell">U/O Spend $</th><th class="num-cell">Usage %</th><th>Status</th></tr></thead>
            <tbody>${groups.map(g => g.brands.length > 1 ? renderOverviewClientGroupRow(g) : renderOverviewClientBrandRow(g.brands[0], false)).join("")}</tbody>
          </table>` : `<div class="empty">No brand data for this period.</div>`}
        </div>
      </td>
    </tr>`;
  }

  const OVERVIEW_COLUMNS = {
    period:   { label:"Period",     get:p=>p.year*100+p.month },
    brands:   { label:"Brands",     get:p=>p.brandCount },
    over:     { label:"Overspend",  get:p=>p.overCount },
    under:    { label:"Underspend", get:p=>p.underCount },
    target:   { label:"On Target",  get:p=>p.targetCount },
    avguo:    { label:"Avg U/O Spend", get:p=>(p.avgUOSpend===null?-Infinity:p.avgUOSpend) },
  };
  function renderOverviewPage(){
    const tolerance = state.tolerance;
    const latest = latestAvailableMonth();
    const perMonth = state.data.months.map(m=>{
      const rows = aggregateBrands([m], tolerance);
      const s = statsOf(rows);
      return {
        year:m.year, month:m.month, label:`${MONTH_NAMES[m.month]} ${m.year}`, ...s,
        brandCount: rows.length,
        isLatest: latest && m.year===latest.year && m.month===latest.month,
      };
    });

    const sort = state.overviewSort;
    const col = OVERVIEW_COLUMNS[sort.key] || OVERVIEW_COLUMNS.period;
    const sorted = [...perMonth].sort((a,b)=>{
      const av = col.get(a), bv = col.get(b);
      const cmp = av < bv ? -1 : av > bv ? 1 : 0;
      return sort.dir === "desc" ? -cmp : cmp;
    });

    // "Show" filter: collapse the full trend history down to just the current year or current
    // month's row when the table gets too long to be useful at a glance.
    const range = state.overviewRange || "all";
    const visible = range === "all" ? sorted
      : range === "year" ? sorted.filter(p => latest && p.year === latest.year)
      : sorted.filter(p => latest && p.year === latest.year && p.month === latest.month);

    // Snapshot bar: the latest period's overall mix, at a glance, before the full trend table.
    let snapshotBarHtml = "";
    if(latest){
      const latestRows = aggregateBrands([latest], tolerance);
      const ls = statsOf(latestRows);
      const total = latestRows.length || 1;
      snapshotBarHtml = `
        <div class="health-legend" style="justify-content:center; margin:14px 0 4px 0;">
          <span><i class="dot over"></i>${ls.overCount} Overspend</span>
          <span><i class="dot under"></i>${ls.underCount} Underspend</span>
          <span><i class="dot target"></i>${ls.targetCount} On Target</span>
        </div>
        <div style="text-align:center; color:var(--muted); font-weight:600; font-size:12.5px; margin:0 0 22px 0;">${MONTH_NAMES[latest.month]} ${latest.year} snapshot · ${latestRows.length} brands</div>`;
    }

    function th(key, extraClass){
      const active = sort.key === key;
      const arrow = active ? (sort.dir==="desc" ? " ▼" : " ▲") : "";
      return `<th class="${extraClass||""} sortable" data-sortkey="${key}" style="cursor:pointer">${OVERVIEW_COLUMNS[key].label}${arrow}</th>`;
    }

    contentEl.innerHTML = `
      <div class="section-title" style="margin-top:2px">All-time overview <span class="pill">${perMonth.length} periods · ${PERIODS.length} months tracked total</span></div>
      ${snapshotBarHtml}
      <div class="control-row" style="margin:0 0 14px 0; justify-content:center;">
        <span class="field-label">Show</span>
        <button class="pill-btn ${range==="all"?"active":""}" data-overviewrange="all">All History</button>
        <button class="pill-btn ${range==="year"?"active":""}" data-overviewrange="year">Current Year</button>
        <button class="pill-btn ${range==="month"?"active":""}" data-overviewrange="month">Current Month</button>
      </div>
      <table class="trend-table nowrap-cells" id="overviewTable">
        <thead><tr>
          ${th("period")}
          ${th("brands","num-cell")}
          <th class="num-cell sortable" data-sortkey="over" style="cursor:pointer"><i class="dot over"></i>${OVERVIEW_COLUMNS.over.label}${sort.key==="over"?(sort.dir==="desc"?" ▼":" ▲"):""}</th>
          <th class="num-cell sortable" data-sortkey="under" style="cursor:pointer"><i class="dot under"></i>${OVERVIEW_COLUMNS.under.label}${sort.key==="under"?(sort.dir==="desc"?" ▼":" ▲"):""}</th>
          <th class="num-cell sortable" data-sortkey="target" style="cursor:pointer"><i class="dot target"></i>${OVERVIEW_COLUMNS.target.label}${sort.key==="target"?(sort.dir==="desc"?" ▼":" ▲"):""}</th>
          ${th("avguo","num-cell")}
        </tr></thead>
        <tbody>
          ${visible.map(p=>{
            const row = `<tr class="${p.isLatest?"row-latest":""}">
              <td class="brand-name ov-period-clickable" data-ovc-year="${p.year}" data-ovc-month="${p.month}" title="Click to view all clients">${p.label}${p.isLatest?`<span class="latest-pill">Latest</span>`:""}</td>
              <td class="num-cell">${p.brandCount}</td>
              <td class="num-cell ov-num-clickable" data-ov-year="${p.year}" data-ov-month="${p.month}" data-ov-status="Overspend" title="Click to view brands"><span class="${p.overCount>0?"text-over":"text-zero"}">${p.overCount}</span></td>
              <td class="num-cell ov-num-clickable" data-ov-year="${p.year}" data-ov-month="${p.month}" data-ov-status="Underspend" title="Click to view brands"><span class="${p.underCount>0?"text-under":"text-zero"}">${p.underCount}</span></td>
              <td class="num-cell ov-num-clickable" data-ov-year="${p.year}" data-ov-month="${p.month}" data-ov-status="On Target" title="Click to view brands"><span class="${p.targetCount>0?"text-target":"text-zero"}">${p.targetCount}</span></td>
              <td class="num-cell"><span class="${p.avgUOSpend===null?"":(p.avgUOSpend>=0?"text-target":"text-over")}">${fmtMoney(p.avgUOSpend)}</span></td>
            </tr>`;
            const drilled = state.overviewDrill && state.overviewDrill.year===p.year && state.overviewDrill.month===p.month;
            if(!drilled) return row;
            return row + (state.overviewDrill.mode === "clients"
              ? renderOverviewClientsDrillRow(p.year, p.month, 6)
              : renderOverviewDrillRow(p.year, p.month, state.overviewDrill.status, 6));
          }).join("")}
        </tbody>
      </table>
    `;
  }

  // Single quarter card for the all-quarters grid (distinct from renderQuarterCompare's
  // two-card current-vs-previous pair used on the Report page). Delta shows against whichever
  // quarter immediately precedes it in the sequence being displayed, if any.
  function renderQuarterCard(qd, prevStats){
    function deltaHtml(curVal, prevVal){
      if(curVal===null||prevVal===null||!isFinite(curVal)||!isFinite(prevVal)) return "";
      const d = curVal - prevVal;
      if(Math.abs(d) < 0.5) return `<div class="qdelta">no change vs prev</div>`;
      return `<div class="qdelta">${d>0?"▲ +":"▼ -"}${fmtMoney(Math.abs(d))} vs prev</div>`;
    }
    const s = qd.stats;
    const list = [
      {label:"Avg Overspend", val:s.avgOverspend, prevVal:prevStats?prevStats.avgOverspend:null, cls:"over"},
      {label:"Avg Underspend", val:s.avgUnderspend, prevVal:prevStats?prevStats.avgUnderspend:null, cls:"under"},
      {label:"Avg On Target", val:s.avgOnTarget, prevVal:prevStats?prevStats.avgOnTarget:null, cls:"target"},
      {label:"Avg U/O Spend", val:s.avgUOSpend, prevVal:prevStats?prevStats.avgUOSpend:null, cls:"uo"},
    ];
    return `<div class="qcard${qd.isLatest?" current":""}">
      <h3>${qd.label}${qd.isLatest ? ` <span class="pill">latest</span>` : ""}</h3>
      <div class="qmetric-grid">
        ${list.map(m=>`
          <div class="qmetric">
            <div class="qval ${m.cls}">${fmtMoney(m.val)}</div>
            <div class="qlbl">${m.label}</div>
            ${prevStats ? deltaHtml(m.val, m.prevVal) : ""}
          </div>`).join("")}
      </div>
    </div>`;
  }

  // ---------- Quarter Compare: every quarter that has data in the selected year, side by side —
  // 4 quarters for a completed past year, fewer for the current year (only as many as have been
  // tracked so far), driven by the Year selector. ----------
  function renderQuarterComparePage(){
    const tolerance = state.tolerance;
    const monthsInYear = state.data.months.filter(m=>m.year===state.year);
    const maxMonth = monthsInYear.length ? Math.max(...monthsInYear.map(m=>m.month)) : 0;
    const maxQuarter = maxMonth ? quarterOf(maxMonth) : 0;

    const quarters = [];
    for(let q=1; q<=maxQuarter; q++){
      const qMonths = monthsInQuarter(state.year, q).map(({year,month})=>getMonthEntry(year,month)).filter(Boolean);
      if(!qMonths.length) continue;
      quarters.push({ quarter:q, label:`Q${q} ${state.year}`, stats: statsOf(aggregateBrands(qMonths, tolerance)) });
    }
    if(quarters.length) quarters[quarters.length-1].isLatest = (state.year === (latestAvailableMonth()||{}).year);

    // Row layout: the most recent pair of quarters always leads, newest-first, on its own row;
    // any older quarters follow below in their own row(s), centered, in normal chronological
    // (oldest-first) order — e.g. 4 quarters on record renders as [Q4,Q3] on top, [Q1,Q2] below;
    // 3 renders as [Q3,Q2] on top with Q1 alone, centered, underneath; 2 or fewer just sit
    // together on one row.
    const n = quarters.length;
    let displayRows = [];
    if(n <= 2){
      displayRows = [ [...quarters].reverse() ];
    } else {
      const newestPair = [quarters[n-1], quarters[n-2]];
      const older = quarters.slice(0, n-2);
      displayRows = [newestPair, older];
    }

    contentEl.innerHTML = `
      <div class="section-title" style="margin-top:2px">Quarter Compare</div>
      <div class="control-row">
        <span class="field-label">Year</span>
        <span id="qcYearSlot"></span>
        <span class="period-pill">${quarters.length} quarter${quarters.length===1?"":"s"} tracked in ${state.year}</span>
      </div>
      ${quarters.length ? displayRows.filter(r=>r.length).map(rowQuarters => `
        <div class="quarters-grid">
          ${rowQuarters.map(qd=>{
            const i = quarters.indexOf(qd);
            return renderQuarterCard(qd, i>0 ? quarters[i-1].stats : null);
          }).join("")}
        </div>
      `).join("") : `<div class="empty">No data available for ${state.year} yet.</div>`}
    `;
    mount(yearWrap, "qcYearSlot");
  }

  // ---------- By Client: pick a client, browse it by year / month / week ----------
  // A "client" is the umbrella every brand rolls up to via ClickUp's own "Client / Brand" field
  // (e.g. all 18 Trade Kings brands roll up to client "Trade Kings"; "Access Bank" + its
  // Linkedin/W Community channel lines all roll up to client "Access Bank"). Single-brand clients
  // just show that one brand as their whole total.
  // These clients still count fully toward every all-brand total (Report, Overview, Snapshot,
  // By Assignee all keep including their spend) — they're just kept out of the By Client page's
  // own selectable list/dropdown, so they don't show up individually there.
  const HIDDEN_CLIENT_NAMES = new Set(["Yoyo Foods", "Enda", "Crunchy King"]);
  function allClientGroupNames(){
    if(!state.data) return [];
    const set = new Set();
    state.data.months.forEach(m=>m.brands.forEach(b=>set.add(b.client || b.name)));
    HIDDEN_CLIENT_NAMES.forEach(n=>set.delete(n));
    return [...set].sort();
  }
  function currentClientEntityNames(){
    return allClientGroupNames();
  }
  function currentSelectedEntity(){
    return state.selectedClientGroup;
  }
  function setSelectedEntity(v){
    state.selectedClientGroup = v;
  }
  function populateClientSelect(){
    const names = currentClientEntityNames();
    clientSelect.innerHTML = names.map(n=>`<option value="${n}">${n}</option>`).join("");
    let sel = currentSelectedEntity();
    if(!sel || !names.includes(sel)) sel = names[0] || null;
    setSelectedEntity(sel);
    if(sel) clientSelect.value = sel;
  }
  function renderClientPage(){
    populateClientSelect();
    const names = currentClientEntityNames();
    if(!names.length){ contentEl.innerHTML = `<div class="empty">No brand data available yet.</div>`; return; }
    const entity = currentSelectedEntity();
    const tolerance = state.tolerance;
    const aggFn = aggregateByClient;
    const weekFn = weekBrandsByClient;

    let row, label, approvedLabel = "Approved Spend";
    if(state.clientPeriod === "year"){
      const monthsInYear = state.data.months.filter(m=>m.year===state.year);
      row = aggFn(monthsInYear, tolerance).find(r=>r.name===entity);
      label = `${state.year} — full year`;
    } else if(state.clientPeriod === "month"){
      const m = getMonthEntry(state.year, state.month);
      row = m ? aggFn([m], tolerance).find(r=>r.name===entity) : null;
      label = `${MONTH_NAMES[state.month]} ${state.year}`;
    } else {
      const m = getMonthEntry(state.year, state.month);
      row = weekFn(m, state.week, tolerance).find(r=>r.name===entity);
      label = `${MONTH_NAMES[state.month]} ${state.year} — through Week ${state.week}`;
      approvedLabel = `Prorated Target (Wk ${state.week})`;
    }
    const statusCls = row ? badgeClass(row.status) : "";
    const cardCls = statusCls === "over" ? "c4" : statusCls === "under" ? "c3" : statusCls === "target" ? "c5" : "c1";

    // Full history trend for this one client, across every period on record.
    const history = state.data.months.map(m=>{
      const r = aggFn([m], tolerance).find(x=>x.name===entity);
      return r ? {label:`${MONTH_NAMES[m.month]} ${m.year}`, ...r} : null;
    }).filter(Boolean);

    const assigneeNames = (row && row.assignees && row.assignees.length) ? row.assignees.join(", ") : null;
    const hasBrands = !!(row && row.brands && row.brands.length > 1);

    // The brand filter only makes sense for the currently selected client/period — drop it if
    // it no longer names one of this client's actual brands (e.g. after switching clients).
    if(state.clientBrandFilter && !(row && row.brands && row.brands.some(b=>b.name===state.clientBrandFilter))){
      state.clientBrandFilter = null;
    }

    let brandsSectionHtml = "";
    if(hasBrands){
      const visibleBrands = state.clientBrandFilter ? row.brands.filter(b=>b.name===state.clientBrandFilter) : row.brands;
      brandsSectionHtml = `
        <div class="control-row" style="margin:24px 0 10px 0;">
          <span class="field-label">All brands under ${entity}</span>
          <span class="pill">${row.brands.length} brands</span>
        </div>
        <table class="nowrap-cells">
          <thead><tr><th>Brand</th><th class="num-cell">${approvedLabel}</th><th class="num-cell">Actual</th><th class="num-cell">U/O Spend $</th><th class="num-cell">Usage %</th><th>Status</th></tr></thead>
          <tbody>${visibleBrands.map(b=>{
            const uo = b.approved - b.actual;
            const pct = b.approved > 0 ? (b.actual/b.approved*100) : (b.actual>0?Infinity:null);
            const st = classify(pct, tolerance);
            return `<tr>
              <td class="brand-name">${b.name}</td>
              <td class="num-cell">${fmtMoney(b.approved)}</td>
              <td class="num-cell">${fmtMoney(b.actual)}</td>
              <td class="num-cell"><span class="${st==="Overspend"?"text-over":st==="Underspend"?"text-under":"text-target"}">${fmtMoney(uo)}</span></td>
              <td class="num-cell">${fmtPct(pct)}</td>
              <td><span class="badge ${badgeClass(st)}">${st}</span></td>
            </tr>`;
          }).join("")}</tbody>
        </table>`;
    }

    contentEl.innerHTML = `
      <div class="section-title" style="margin-top:2px">${entity}${hasBrands ? ` <span class="pill">${row.brands.length} brands</span>` : ""}${assigneeNames ? ` <span class="pill">Assigned to: ${assigneeNames}</span>` : ""}</div>
      <div class="control-row" id="clientControlRow">
        <span class="field-label ${state.clientPeriod==="year"?"active":""}">Year</span>
        <span id="ccYearSlot"></span>
        <span class="field-label ${state.clientPeriod==="month"?"active":""}">Month</span>
        <span id="ccMonthSlot"></span>
        <span class="field-label ${state.clientPeriod==="week"?"active":""}">Week</span>
        <span id="ccWeekSlot"></span>
        <span class="field-label">Client</span>
        <span id="ccClientSlot"></span>
        ${hasBrands ? `
        <span class="field-label">Brand</span>
        <select id="clientBrandFilterSelect">
          <option value="">All brands</option>
          ${row.brands.map(b=>`<option value="${b.name}" ${state.clientBrandFilter===b.name?"selected":""}>${b.name}</option>`).join("")}
        </select>` : ""}
        <span class="period-pill">${label}</span>
      </div>
      <div class="stat-grid">
        <div class="stat-card ${cardCls}"><div class="num ${statusCls}">${row ? row.status : "—"}</div><div class="lbl">Status</div></div>

  // ---------- By Assignee: who's responsible for how many clients, and their status mix.
  // Assignee tracking only started with the July 2026 tracker, so this page only ever offers
  // periods from July 2026 onward. ----------
  function eligibleAssigneeMonths(){
    if(!state.data) return [];
    return state.data.months.filter(m=>isAssigneeEligible(m.year, m.month));
  }
  function renderAssigneePage(){
    const eligible = eligibleAssigneeMonths();
    if(!eligible.length){
      contentEl.innerHTML = `<div class="empty">Assignee tracking starts with the July 2026 tracker — no eligible periods yet.</div>`;
      return;
    }
    if(!state.assigneePeriod || !eligible.some(m=>`${m.year}-${m.month}`===state.assigneePeriod)){
      const latest = eligible[eligible.length-1];
      state.assigneePeriod = `${latest.year}-${latest.month}`;
    }
    const [ay, am] = state.assigneePeriod.split("-").map(Number);
    const monthEntry = getMonthEntry(ay, am);
    const tolerance = state.tolerance;
    const granularity = state.assigneeGranularity || "month";
    const week = state.assigneeWeek || 5;
    const rows = !monthEntry ? [] : (granularity==="week" ? weekBrands(monthEntry, week, tolerance) : aggregateBrands([monthEntry], tolerance));
    const periodLabel = granularity==="week" ? `${MONTH_NAMES[am]} ${ay} — through Week ${week}` : `${MONTH_NAMES[am]} ${ay}`;
    const cumAvg = granularity==="week" ? null : cumulativeAvgUOSpend(ay, am);
    const overallStats = statsOf(rows);

    // Group brands by assignee (a brand with several assignees counts under each of them).
    const byAssignee = new Map();
    for(const r of rows){
      const names = (r.assignees && r.assignees.length) ? r.assignees : ["Unassigned"];
      for(const name of names){
        if(!byAssignee.has(name)) byAssignee.set(name, []);
        byAssignee.get(name).push(r);
      }
    }
    // Each entry in `rowsForPerson` is one brand-level row for that period — so counting the
    // array length gives brands, not clients. Distinct clients need de-duping by r.client.
    const summary = [...byAssignee.entries()].map(([name, rowsForPerson])=>{
      const s = statsOf(rowsForPerson);
      const clientCount = new Set(rowsForPerson.map(r=>r.client||r.name)).size;
      return { name, clients: rowsForPerson, clientCount, brandCount: rowsForPerson.length, ...s };
    }).sort((a,b)=> b.brandCount - a.brandCount);
    // Custom priority ordering on top of the default busiest-first sort: Kataka always first,
    // Chewe/Conard/Precious always last (in that order), everyone else keeps busiest-first order.
    const ASSIGNEE_SORT_TOP = ["kataka"];
    const ASSIGNEE_SORT_BOTTOM = ["chewe", "conard", "precious"];
    summary.sort((a,b)=>{
      const an = firstName(a.name).toLowerCase(), bn = firstName(b.name).toLowerCase();
      const aTop = ASSIGNEE_SORT_TOP.includes(an) ? 0 : 1, bTop = ASSIGNEE_SORT_TOP.includes(bn) ? 0 : 1;
      if(aTop !== bTop) return aTop - bTop;
      const aBotIdx = ASSIGNEE_SORT_BOTTOM.indexOf(an), bBotIdx = ASSIGNEE_SORT_BOTTOM.indexOf(bn);
      const aBot = aBotIdx === -1 ? 0 : 1, bBot = bBotIdx === -1 ? 0 : 1;
      if(aBot !== bBot) return aBot - bBot;
      if(aBot === 1 && bBot === 1) return aBotIdx - bBotIdx;
      return 0; // preserve existing busiest-first order within the middle group
    });

    const groupBy = state.assigneeGroupBy || "assignee";
    state.lastRows = rows;
    contentEl.innerHTML = `
      <div class="section-title" style="margin-top:2px">By Assignee</div>
      <div class="control-row">
        <button class="pill-btn ${granularity==="month"?"active":""}" data-assigneeperiod="month">Month</button>
        <select id="assigneeMonthSelect">
          ${eligible.map(m=>`<option value="${m.year}-${m.month}" ${(`${m.year}-${m.month}`===state.assigneePeriod)?"selected":""}>${MONTH_NAMES[m.month]} ${m.year}</option>`).join("")}
        </select>
        <button class="pill-btn ${granularity==="week"?"active":""}" data-assigneeperiod="week">Week</button>
        <select id="assigneeWeekSelect">
            <option value="1" ${week===1?"selected":""}>Week 1</option>
            <option value="2" ${week===2?"selected":""}>Week 2</option>
            <option value="3" ${week===3?"selected":""}>Week 3</option>
            <option value="4" ${week===4?"selected":""}>Week 4</option>
            <option value="5" ${week===5?"selected":""}>Week 5</option>
          </select>
        <span class="field-label" style="margin-left:14px;">Group</span>
        <button class="pill-btn ${groupBy==="assignee"?"active":""}" data-assigneegroupby="assignee">By Assignee</button>
        <button class="pill-btn ${groupBy==="client"?"active":""}" data-assigneegroupby="client">By Client</button>
        <span class="period-pill">${periodLabel} · across all clients this period</span>
      </div>
      ${groupBy==="client" ? renderAssigneeByClient(rows, overallStats) : renderAssigneeSnapshot(summary, overallStats, rows)}
    `;
    document.getElementById("assigneeMonthSelect").addEventListener("change", (e)=>{
      state.assigneePeriod = e.target.value;
      state.drillAssignee = null;
      render();
    });
    const weekSel = document.getElementById("assigneeWeekSelect");
    if(weekSel){
      weekSel.addEventListener("change", (e)=>{
        state.assigneeWeek = Number(e.target.value);
        state.assigneeGranularity = "week";
        render();
      });
    }
  }
  // A deliberately different snapshot for By Assignee: people-themed icons and a team roster
  // strip instead of the $-figure stat cards used on Report/Client, so this page reads as its
  // own thing (who's covering what) rather than a repeat of the budget-pacing cards.
  const ASSIGNEE_ICONS = {
    person: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
    folder: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" fill="currentColor"/></svg>`,
    trophy: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 4h10v4a5 5 0 0 1-10 0V4z" fill="currentColor"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><rect x="10" y="14" width="4" height="4" fill="currentColor"/><rect x="7" y="18" width="10" height="2" rx="1" fill="currentColor"/></svg>`,
    scale: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3v18M6 7l-3 6h6l-3-6zm12 0l-3 6h6l-3-6zM4 13a3 3 0 0 0 6 0M14 13a3 3 0 0 0 6 0M5 21h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  };
  const AVATAR_COLORS = ["var(--purple)","var(--pink)","var(--orange)","var(--teal)","var(--red)"];
  function initialsOf(name){
    return name.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
  }
  function renderAssigneeSnapshot(summary, overallStats, rows){
    const totalAssignees = summary.length;
    const totalClients = new Set(rows.map(r=>r.client||r.name)).size;
    const totalBrands = rows.length;
    const busiest = summary.length ? summary.reduce((a,b)=> b.brandCount>a.brandCount ? b : a) : null;
    const avgPerAssignee = totalAssignees ? (summary.reduce((a,s)=>a+s.clientCount,0)/totalAssignees) : null;
    return `
      <div class="assignee-kpi-line">
        <div class="akpi-chip"><b style="color:var(--purple)">${totalAssignees}</b>Assignees</div>
        <div class="akpi-chip"><b style="color:var(--pink)">${totalClients} clients</b>${totalBrands} brands</div>
        <div class="akpi-chip"><b style="color:var(--orange)">${busiest ? firstName(busiest.name) : "—"}</b>Busiest${busiest ? " · "+busiest.clientCount+" clients · "+busiest.brandCount+" brands" : ""}</div>
        <div class="akpi-chip"><b style="color:var(--teal)">${avgPerAssignee===null?"—":avgPerAssignee.toFixed(1)}</b>Avg Clients / Assignee</div>
      </div>
      <div class="assignee-kpi-line" style="margin:14px 0 22px 0;">
        <div class="akpi-chip"><b class="text-over">${overallStats.overCount}</b>Overspend</div>
        <div class="akpi-chip"><b class="text-under">${overallStats.underCount}</b>Underspend</div>
        <div class="akpi-chip"><b class="text-target">${overallStats.targetCount}</b>On Target</div>
        <div class="akpi-chip">Avg Overspend: <b class="text-over">${fmtMoney(overallStats.avgOverspend)}</b></div>
        <div class="akpi-chip">Avg Underspend: <b class="text-under">${fmtMoney(overallStats.avgUnderspend)}</b></div>
        <div class="akpi-chip">Avg On Target: <b class="text-target">${fmtMoney(overallStats.avgOnTarget)}</b></div>
      </div>
      <div class="section-title" style="margin:0 0 12px 0; text-align:center;">Assignees <span class="pill">click a name to see their clients</span></div>
      <div class="assignee-namelist">
        ${summary.map((s,i)=>{
          const color = AVATAR_COLORS[i%AVATAR_COLORS.length];

          return `
          <div class="assignee-name-card${isActive?" active":""}" data-assignee="${s.name}">
